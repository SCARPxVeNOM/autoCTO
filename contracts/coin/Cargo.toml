[package]
name = "autocto-coin"
description = "AutoCTO coin: an NEP-141 memecoin that can bid for, and be taken over by, its siblings"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.99.1"
image_digest = "sha256:c9655eaf7436b90c87ea8b25739f91063032c5c30ba24cfeafe72c142943b5bb"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[dependencies]
# "unstable" is where the SDK keeps ecrecover, used to check the model's signature.
near-sdk = { workspace = true, features = ["unstable"] }
near-contract-standards.workspace = true
uint = { version = "0.10", default-features = false }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
