[workspace]
resolver = "3"
members = [
    "contracts/coin",
    "contracts/launchpad",
    "contracts/mock-outlayer",
    "contracts/mock-ft",
    "brain",
    "demo",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/SCARPxVeNOM/KillerCoins"

[workspace.dependencies]
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
