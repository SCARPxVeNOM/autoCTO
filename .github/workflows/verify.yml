# Checks the live testnet deployment against this repo: zero keys, code and brain hashes, rules,
# and the latest signed AI answer. Read-only. Runs on every push and once a day.
name: Verify testnet

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  verify:
    name: Testnet runs this repo (7 checks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify.mjs
